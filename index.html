
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEBLENG REWARDS</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #10121b;
  color: white;
  font-family: Arial, sans-serif;
  padding: 20px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #a78bfa;
}

.subtitle {
  color: #999;
  font-size: 12px;
  margin-top: 5px;
}

button {
  cursor: pointer;
}

.logout {
  background: #303346;
  border: 1px solid #41445a;
  color: white;
  padding: 9px 12px;
  border-radius: 8px;
}

.balance {
  background: linear-gradient(135deg,#7045d8,#38206e);
  padding: 25px;
  border-radius: 18px;
  margin-bottom: 20px;
}

.balance small {
  color: #ddd;
}

.balance h1 {
  font-size: 34px;
  margin: 12px 0;
}

.balance p {
  font-size: 12px;
  color: #ddd;
}

.section-title {
  font-size: 18px;
  margin: 25px 0 15px;
}

.menu {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.item {
  background: #202331;
  padding: 20px 12px;
  border-radius: 15px;
  text-align: center;
  border: 1px solid #303346;
  color: white;
  width: 100%;
  min-height: 120px;
}

.item:active {
  background: #303346;
}

.item .icon {
  font-size: 30px;
  margin-bottom: 12px;
}

.item h3 {
  font-size: 14px;
  margin-bottom: 7px;
}

.item p {
  font-size: 11px;
  color: #aaa;
}

.referral {
  background: #202331;
  padding: 20px;
  border-radius: 15px;
  margin-top: 15px;
  border: 1px solid #303346;
}

.referral h3 {
  margin-bottom: 10px;
}

.referral p {
  color: #aaa;
  font-size: 13px;
  line-height: 1.6;
}

.referral button {
  width: 100%;
  margin-top: 15px;
  padding: 13px;
  background: #8055e8;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: bold;
}

.note {
  color: #888;
  font-size: 11px;
  text-align: center;
  margin: 25px 0;
}

#loading {
  text-align: center;
  margin-top: 50px;
  color: #aaa;
}

</style>
</head>

<body>

<div id="loading">Memeriksa akun...</div>

<main id="dashboard" hidden>

<header>
  <div>
    <div class="logo">DEBLENG REWARDS</div>
    <div class="subtitle">WATCH • EARN • REDEEM</div>
  </div>

  <button class="logout" id="logoutButton">
    Keluar
  </button>
</header>

<div class="balance">
  <small>TOTAL SALDO</small>
  <h1>Rp0</h1>
  <p>Saldo reward kamu</p>
</div>

<h2 class="section-title">Menu Utama</h2>

<div class="menu">

  <button class="item" data-page="ads">
    <div class="icon">▶️</div>
    <h3>Tonton Iklan</h3>
    <p>Aktivitas reward</p>
  </button>

  <button class="item" data-page="referral">
    <div class="icon">👥</div>
    <h3>Undang Teman</h3>
    <p>Program referral</p>
  </button>

  <button class="item" data-page="withdraw">
    <div class="icon">💰</div>
    <h3>Penarikan</h3>
    <p>Informasi penarikan</p>
  </button>

  <button class="item" data-page="profile">
    <div class="icon">👤</div>
    <h3>Profil</h3>
    <p>Informasi akun</p>
  </button>

</div>

<div class="referral">
  <h3>🎁 Undang Teman</h3>
  <p>
    Program referral akan tersedia setelah
    sistem verifikasi selesai dibuat.
  </p>

  <button id="inviteButton">
    UNDANG TEMAN
  </button>
</div>

<p class="note">
  DEBLENG REWARDS © 2026<br>
  Saldo dan reward mengikuti ketentuan program.
</p>

</main>

<script type="module">
import { auth } from "./firebase.js";

import {
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/13.4.0/firebase-auth.js";

const loading = document.getElementById("loading");
const dashboard = document.getElementById("dashboard");

onAuthStateChanged(auth, (user) => {
  if (user) {
    loading.hidden = true;
    dashboard.hidden = false;
  } else {
    window.location.replace("login.html");
  }
});

document.getElementById("logoutButton").addEventListener("click", async () => {
  try {
    await signOut(auth);
    window.location.replace("login.html");
  } catch (error) {
    alert("Gagal keluar. Silakan coba lagi.");
  }
});

document.querySelectorAll("[data-page]").forEach(button => {
  button.addEventListener("click", () => {
    const page = button.dataset.page;

    const messages = {
      ads: "Fitur iklan belum diaktifkan.",
      referral: "Sistem referral masih dalam pengembangan.",
      withdraw: "Fitur penarikan belum tersedia.",
      profile: "Email akun: " + (auth.currentUser?.email || "-")
    };

    alert(messages[page]);
  });
});

document.getElementById("inviteButton").addEventListener("click", () => {
  alert("Fitur undang teman masih dalam pengembangan.");
});
</script>

</body>
</html>
